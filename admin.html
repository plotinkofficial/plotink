<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PLOTINK Property Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .admin-header {
            background: #123C69;
            color: #fff;
            padding: 18px 0;
        }

        .admin-card {
            border: 0;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 11px 14px;
        }

        .btn-primary {
            background: #123C69;
            border-color: #123C69;
            border-radius: 10px;
        }

        .btn-primary:hover {
            background: #0d3155;
        }

        .property-item {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fff;
        }

        .property-image {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
        }

        .login-box {
            max-width: 450px;
            margin: 70px auto;
        }

        .hidden {
            display: none !important;
        }

        .status-badge {
            font-size: 12px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="admin-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">

            <div>
                <h4 class="mb-1">
                    <i class="bi bi-buildings"></i>
                    PLOTINK Property Manager
                </h4>

                <small>Manage your property listings</small>
            </div>

            <div>
                <a href="index.html" class="btn btn-light me-2">
                    <i class="bi bi-house"></i> Website
                </a>

                <button id="logoutBtn"
                        class="btn btn-outline-light hidden">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>

        </div>
    </div>
</header>


<!-- LOGIN SECTION -->
<section id="loginSection">

    <div class="container">

        <div class="card admin-card login-box">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-shield-lock"
                       style="font-size:45px;color:#123C69;"></i>

                    <h3 class="mt-2">
                        Admin Login
                    </h3>

                    <p class="text-muted mb-0">
                        Login to manage PLOTINK properties
                    </p>

                </div>


                <form id="loginForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="loginEmail"
                               class="form-control"
                               value="plotinkofficial@gmail.com"
                               required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               id="loginPassword"
                               class="form-control"
                               placeholder="Enter your password"
                               required>

                    </div>


                    <button type="submit"
                            class="btn btn-primary w-100">

                        <i class="bi bi-box-arrow-in-right"></i>
                        Login

                    </button>

                </form>


                <div id="loginMessage"
                     class="mt-3">
                </div>

            </div>

        </div>

    </div>

</section>



<!-- ADMIN SECTION -->
<section id="adminSection"
         class="container py-5 hidden">


    <!-- ADD / EDIT PROPERTY -->

    <div class="card admin-card mb-4">

        <div class="card-body p-4">

            <h4 class="mb-4">

                <i class="bi bi-plus-circle"></i>

                <span id="formTitle">
                    Add Property
                </span>

            </h4>


            <form id="propertyForm">

                <div class="row">


                    <!-- TITLE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Property Title
                        </label>

                        <input type="text"
                               id="propertyTitle"
                               class="form-control"
                               placeholder="2 BHK House for Sale"
                               required>

                    </div>


                    <!-- TYPE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Property Type
                        </label>

                        <select id="propertyType"
                                class="form-select"
                                required>

                            <option value="">
                                Select Type
                            </option>

                            <option>Residential</option>
                            <option>Commercial</option>
                            <option>Plot</option>
                            <option>House</option>
                            <option>Flat</option>
                            <option>Shop</option>
                            <option>Land</option>

                        </select>

                    </div>


                    <!-- LOCATION -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input type="text"
                               id="propertyLocation"
                               class="form-control"
                               placeholder="Dehradun, Uttarakhand"
                               required>

                    </div>


                    <!-- PRICE -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Price
                        </label>

                        <input type="text"
                               id="propertyPrice"
                               class="form-control"
                               placeholder="₹45 Lakh"
                               required>

                    </div>


                    <!-- AREA -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Area
                        </label>

                        <input type="text"
                               id="propertyArea"
                               class="form-control"
                               placeholder="1200 Sq Ft">

                    </div>


                    <!-- PROPERTY LINK -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Property Link
                        </label>

                        <input type="url"
                               id="propertyLink"
                               class="form-control"
                               placeholder="https://plotink.online/...">

                    </div>


                    <!-- IMAGE PATH -->

                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Property Image Path
                        </label>

                        <input type="text"
                               id="propertyImage"
                               class="form-control"
                               placeholder="images/property1.jpg">

                        <small class="text-muted">
                            Example: images/property1.jpg
                        </small>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea id="propertyDescription"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Property details..."></textarea>

                    </div>


                    <!-- STATUS -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select id="propertyStatus"
                                class="form-select">

                            <option value="Available">
                                Available
                            </option>

                            <option value="Sold">
                                Sold
                            </option>

                            <option value="Rented">
                                Rented
                            </option>

                        </select>

                    </div>


                    <!-- FEATURED -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Featured Property
                        </label>

                        <select id="propertyFeatured"
                                class="form-select">

                            <option value="yes">
                                Yes
                            </option>

                            <option value="no">
                                No
                            </option>

                        </select>

                    </div>

                </div>


                <button type="submit"
                        class="btn btn-primary px-4">

                    <i class="bi bi-cloud-upload"></i>

                    <span id="saveButtonText">
                        Save Property
                    </span>

                </button>


                <button type="button"
                        id="cancelEditBtn"
                        class="btn btn-secondary px-4 ms-2 hidden">

                    Cancel Edit

                </button>


            </form>


            <div id="propertyMessage"
                 class="mt-3">
            </div>

        </div>

    </div>



    <!-- PROPERTY LIST -->

    <div class="card admin-card">

        <div class="card-body p-4">

            <h4 class="mb-4">

                <i class="bi bi-list-ul"></i>

                Your Properties

            </h4>


            <div id="propertyList">

                <div class="alert alert-secondary">
                    Loading properties...
                </div>

            </div>

        </div>

    </div>

</section>



<!-- FIREBASE -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        doc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* FIREBASE CONFIG */

    const firebaseConfig = {

        apiKey: "AIzaSyDEXN8qvN0rEOnwO__X3uk5krNnDltGQ6",

        authDomain: "plotink-d7fcb.firebaseapp.com",

        projectId: "plotink-d7fcb",

        storageBucket: "plotink-d7fcb.firebasestorage.app",

        messagingSenderId: "383004515902",

        appId: "1:383004515902:web:9a2723761b0a48530bfb6f",

        measurementId: "G-ML6HP5NX8Q"

    };


    /* INITIALIZE FIREBASE */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* ELEMENTS */

    const loginSection =
        document.getElementById("loginSection");

    const adminSection =
        document.getElementById("adminSection");

    const loginForm =
        document.getElementById("loginForm");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const loginMessage =
        document.getElementById("loginMessage");

    const propertyForm =
        document.getElementById("propertyForm");

    const propertyList =
        document.getElementById("propertyList");

    const propertyMessage =
        document.getElementById("propertyMessage");

    const formTitle =
        document.getElementById("formTitle");

    const saveButtonText =
        document.getElementById("saveButtonText");

    const cancelEditBtn =
        document.getElementById("cancelEditBtn");


    let editingId = null;


    /* LOGIN */

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;


        loginMessage.innerHTML =
            `<div class="alert alert-info">
                Logging in...
             </div>`;


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            loginMessage.innerHTML = "";

                } catch (error) {

            console.error("Firebase Login Error:", error);

            loginMessage.innerHTML =
                `<div class="alert alert-danger">
                    <strong>Login Error:</strong><br>
                    ${error.code}<br>
                    ${error.message}
                </div>`;

        }

    });


    /* AUTH STATE */

    onAuthStateChanged(auth, function(user) {

        if (user) {

            loginSection.classList.add("hidden");

            adminSection.classList.remove("hidden");

            logoutBtn.classList.remove("hidden");

            loadProperties();

        } else {

            loginSection.classList.remove("hidden");

            adminSection.classList.add("hidden");

            logoutBtn.classList.add("hidden");

        }

    });


    /* LOGOUT */

    logoutBtn.addEventListener("click", async function() {

        await signOut(auth);

    });


    /* SAVE PROPERTY */

    propertyForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const user = auth.currentUser;


        if (!user) {

            alert("Please login first.");

            return;

        }


        const propertyData = {

            title:
                document.getElementById("propertyTitle").value.trim(),

            type:
                document.getElementById("propertyType").value,

            location:
                document.getElementById("propertyLocation").value.trim(),

            price:
                document.getElementById("propertyPrice").value.trim(),

            area:
                document.getElementById("propertyArea").value.trim(),

            link:
                document.getElementById("propertyLink").value.trim(),

            image:
                document.getElementById("propertyImage").value.trim(),

            description:
                document.getElementById("propertyDescription").value.trim(),

            status:
                document.getElementById("propertyStatus").value,

            featured:
                document.getElementById("propertyFeatured").value

        };


        try {

            if (editingId) {

                await updateDoc(
                    doc(db, "properties", editingId),
                    {
                        ...propertyData,
                        updatedAt: serverTimestamp()
                    }
                );


                showMessage(
                    "Property updated successfully.",
                    "success"
                );


            } else {

                await addDoc(
                    collection(db, "properties"),
                    {
                        ...propertyData,
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    }
                );


                showMessage(
                    "Property added successfully.",
                    "success"
                );

            }


            resetForm();

            loadProperties();


        } catch (error) {

            console.error(error);

            showMessage(
                "Error saving property: " + error.message,
                "danger"
            );

        }

    });


    /* LOAD PROPERTIES */

    async function loadProperties() {

        propertyList.innerHTML =
            `<div class="alert alert-info">
                Loading properties...
             </div>`;


        try {

            const snapshot =
                await getDocs(
                    collection(db, "properties")
                );


            if (snapshot.empty) {

                propertyList.innerHTML =
                    `<div class="alert alert-secondary">
                        No properties added yet.
                     </div>`;

                return;

            }


            propertyList.innerHTML = "";


            snapshot.forEach(function(documentSnapshot) {

                const property =
                    documentSnapshot.data();

                const id =
                    documentSnapshot.id;


                const image =
                    property.image ||
                    "images/property1.jpg";


                propertyList.innerHTML += `

                    <div class="property-item">

                        <div class="row align-items-center">

                            <div class="col-md-2 mb-3 mb-md-0">

                                <img
                                    src="${image}"
                                    class="property-image"
                                    alt="${escapeHtml(property.title || "Property")}"
                                    onerror="this.src='images/property1.jpg'"
                                >

                            </div>


                            <div class="col-md-7">

                                <h5 class="mb-1">
                                    ${escapeHtml(property.title || "")}
                                </h5>

                                <div class="text-muted mb-1">

                                    <i class="bi bi-geo-alt"></i>
                                    ${escapeHtml(property.location || "")}

                                </div>

                                <strong>
                                    ${escapeHtml(property.price || "")}
                                </strong>

                                <div class="mt-2">

                                    <span class="badge bg-secondary status-badge">
                                        ${escapeHtml(property.status || "Available")}
                                    </span>

                                    ${
                                        property.featured === "yes"
                                        ?
                                        `<span class="badge bg-success status-badge ms-1">
                                            Featured
                                         </span>`
                                        :
                                        ""
                                    }

                                </div>

                            </div>


                            <div class="col-md-3 text-md-end mt-3 mt-md-0">

                                <button
                                    class="btn btn-sm btn-outline-primary me-1"
                                    onclick="editProperty('${id}')">

                                    <i class="bi bi-pencil"></i>
                                    Edit

                                </button>


                                <button
                                    class="btn btn-sm btn-outline-danger"
                                    onclick="deleteProperty('${id}')">

                                    <i class="bi bi-trash"></i>
                                    Delete

                                </button>

                            </div>

                        </div>

                    </div>

                `;

            });


        } catch (error) {

            console.error(error);

            propertyList.innerHTML =
                `<div class="alert alert-danger">
                    Error loading properties:
                    ${escapeHtml(error.message)}
                 </div>`;

        }

    }


    /* EDIT PROPERTY */

    window.editProperty = async function(id) {

        try {

            const snapshot =
                await getDocs(
                    collection(db, "properties")
                );


            let property = null;


            snapshot.forEach(function(documentSnapshot) {

                if (documentSnapshot.id === id) {

                    property =
                        documentSnapshot.data();

                }

            });


            if (!property) {

                alert("Property not found.");

                return;

            }


            editingId = id;


            document.getElementById("propertyTitle").value =
                property.title || "";

            document.getElementById("propertyType").value =
                property.type || "";

            document.getElementById("propertyLocation").value =
                property.location || "";

            document.getElementById("propertyPrice").value =
                property.price || "";

            document.getElementById("propertyArea").value =
                property.area || "";

            document.getElementById("propertyLink").value =
                property.link || "";

            document.getElementById("propertyImage").value =
                property.image || "";

            document.getElementById("propertyDescription").value =
                property.description || "";

            document.getElementById("propertyStatus").value =
                property.status || "Available";

            document.getElementById("propertyFeatured").value =
                property.featured || "no";


            formTitle.textContent =
                "Edit Property";

            saveButtonText.textContent =
                "Update Property";

            cancelEditBtn.classList.remove("hidden");


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {

            console.error(error);

            alert("Unable to edit property.");

        }

    };


    /* DELETE PROPERTY */

    window.deleteProperty = async function(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this property?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            await deleteDoc(
                doc(db, "properties", id)
            );


            showMessage(
                "Property deleted successfully.",
                "success"
            );


            loadProperties();


        } catch (error) {

            console.error(error);

            showMessage(
                "Error deleting property: " + error.message,
                "danger"
            );

        }

    };


    /* CANCEL EDIT */

    cancelEditBtn.addEventListener("click", function() {

        resetForm();

    });


    /* RESET FORM */

    function resetForm() {

        propertyForm.reset();

        editingId = null;

        formTitle.textContent =
            "Add Property";

        saveButtonText.textContent =
            "Save Property";

        cancelEditBtn.classList.add("hidden");

    }


    /* MESSAGE */

    function showMessage(message, type) {

        propertyMessage.innerHTML =
            `<div class="alert alert-${type}">
                ${escapeHtml(message)}
             </div>`;

        setTimeout(function() {

            propertyMessage.innerHTML = "";

        }, 4000);

    }


    /* HTML ESCAPE */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
