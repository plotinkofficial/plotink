<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PLOTINK Admin | Property Manager</title>

    <meta name="robots"
          content="noindex, nofollow">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .admin-wrapper {
            min-height: 100vh;
            padding: 40px 15px;
        }

        .admin-card {
            max-width: 1100px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .login-card {
            max-width: 450px;
            margin: 60px auto;
        }

        .brand-title {
            font-weight: 700;
            color: #198754;
        }

        .property-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            background: #fff;
        }

        .property-image {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            background: #eee;
        }

        .hidden {
            display: none !important;
        }

        .status-badge {
            font-size: 12px;
        }

        .form-label {
            font-weight: 600;
        }

        .section-title {
            font-weight: 700;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {

            .admin-wrapper {
                padding: 20px 10px;
            }

            .admin-card {
                padding: 20px;
            }

            .property-image {
                width: 100%;
                height: 180px;
                margin-bottom: 15px;
            }

        }

    </style>

</head>


<body>


<div class="admin-wrapper">


    <!-- ================================================= -->
    <!-- LOGIN SECTION -->
    <!-- ================================================= -->

    <section id="loginSection">

        <div class="admin-card login-card">

            <div class="text-center mb-4">

                <h2 class="brand-title">
                    <i class="bi bi-building"></i>
                    PLOTINK
                </h2>

                <p class="text-muted mb-0">
                    Admin Property Manager
                </p>

            </div>


            <h4 class="text-center mb-4">
                Login to manage PLOTINK properties
            </h4>


            <form id="loginForm">

                <div class="mb-3">

                    <label
                        for="loginEmail"
                        class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        value="plotinkofficial@gmail.com"
                        required>

                </div>


                <div class="mb-3">

                    <label
                        for="loginPassword"
                        class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Login

                </button>


                <div
                    id="loginMessage"
                    class="mt-3">
                </div>

            </form>

        </div>

    </section>



    <!-- ================================================= -->
    <!-- ADMIN SECTION -->
    <!-- ================================================= -->

    <section
        id="adminSection"
        class="hidden">


        <div class="admin-card">


            <!-- HEADER -->

            <div
                class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">

                <div>

                    <h2 class="brand-title mb-1">

                        <i class="bi bi-building"></i>
                        PLOTINK Property Manager

                    </h2>

                    <p class="text-muted mb-0">
                        Add, edit and manage your website properties.
                    </p>

                </div>


                <button
                    id="logoutBtn"
                    type="button"
                    class="btn btn-outline-danger">

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </button>

            </div>



            <!-- ================================================= -->
            <!-- ADD / EDIT PROPERTY -->
            <!-- ================================================= -->

            <div class="card border-0 shadow-sm mb-4">

                <div class="card-body">

                    <h4
                        id="formTitle"
                        class="section-title">

                        <i class="bi bi-plus-circle"></i>
                        Add Property

                    </h4>


                    <form id="propertyForm">


                        <div class="row">


                            <!-- TITLE -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyTitle"
                                    class="form-label">

                                    Property Title

                                </label>

                                <input
                                    type="text"
                                    id="propertyTitle"
                                    class="form-control"
                                    placeholder="e.g. Premium Residential Plot"
                                    required>

                            </div>


                            <!-- TYPE -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyType"
                                    class="form-label">

                                    Property Type

                                </label>

                                <select
                                    id="propertyType"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Type
                                    </option>

                                    <option value="Plot">
                                        Plot
                                    </option>

                                    <option value="House">
                                        House
                                    </option>

                                    <option value="Flat">
                                        Flat
                                    </option>

                                    <option value="Villa">
                                        Villa
                                    </option>

                                    <option value="Commercial">
                                        Commercial
                                    </option>

                                    <option value="Land">
                                        Land
                                    </option>

                                </select>

                            </div>


                            <!-- LOCATION -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyLocation"
                                    class="form-label">

                                    Location

                                </label>

                                <input
                                    type="text"
                                    id="propertyLocation"
                                    class="form-control"
                                    placeholder="e.g. Sector 15, Gurugram"
                                    required>

                            </div>


                            <!-- PRICE -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyPrice"
                                    class="form-label">

                                    Price

                                </label>

                                <input
                                    type="text"
                                    id="propertyPrice"
                                    class="form-control"
                                    placeholder="e.g. ₹25 Lakh"
                                    required>

                            </div>


                            <!-- AREA -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyArea"
                                    class="form-label">

                                    Area

                                </label>

                                <input
                                    type="text"
                                    id="propertyArea"
                                    class="form-control"
                                    placeholder="e.g. 1000 sq.ft."
                                    required>

                            </div>


                            <!-- PROPERTY LINK -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyLink"
                                    class="form-label">

                                    Property Link

                                </label>

                                <input
                                    type="url"
                                    id="propertyLink"
                                    class="form-control"
                                    placeholder="https://plotink.online/...">

                            </div>


                            <!-- IMAGE -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="propertyImage"
                                    class="form-label">

                                    Image Path

                                </label>

                                <input
                                    type="text"
                                    id="propertyImage"
                                    class="form-control"
                                    placeholder="images/property1.jpg"
                                    required>

                                <small class="text-muted">

                                    Example:
                                    images/property1.jpg

                                </small>

                            </div>


                            <!-- STATUS -->

                            <div class="col-md-3 mb-3">

                                <label
                                    for="propertyStatus"
                                    class="form-label">

                                    Status

                                </label>

                                <select
                                    id="propertyStatus"
                                    class="form-select">

                                    <option value="Available">
                                        Available
                                    </option>

                                    <option value="Sold">
                                        Sold
                                    </option>

                                    <option value="Rented">
                                        Rented
                                    </option>

                                </select>

                            </div>


                            <!-- FEATURED -->

                            <div class="col-md-3 mb-3">

                                <label
                                    for="propertyFeatured"
                                    class="form-label">

                                    Featured

                                </label>

                                <select
                                    id="propertyFeatured"
                                    class="form-select">

                                    <option value="yes">
                                        Yes
                                    </option>

                                    <option value="no">
                                        No
                                    </option>

                                </select>

                            </div>


                            <!-- DESCRIPTION -->

                            <div class="col-12 mb-3">

                                <label
                                    for="propertyDescription"
                                    class="form-label">

                                    Description

                                </label>

                                <textarea
                                    id="propertyDescription"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter property description..."
                                    required></textarea>

                            </div>


                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2 flex-wrap">

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-save"></i>

                                <span id="saveButtonText">
                                    Save Property
                                </span>

                            </button>


                            <button
                                type="button"
                                id="cancelEditBtn"
                                class="btn btn-secondary hidden">

                                <i class="bi bi-x-circle"></i>
                                Cancel Edit

                            </button>

                        </div>


                        <div
                            id="propertyMessage"
                            class="mt-3">
                        </div>


                    </form>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- PROPERTY LIST -->
            <!-- ================================================= -->

            <div>

                <div
                    class="d-flex justify-content-between align-items-center mb-3">

                    <h4 class="section-title mb-0">

                        <i class="bi bi-list-ul"></i>
                        Your Properties

                    </h4>


                    <button
                        id="refreshPropertiesBtn"
                        type="button"
                        class="btn btn-outline-success btn-sm">

                        <i class="bi bi-arrow-clockwise"></i>
                        Refresh

                    </button>

                </div>


                <div id="propertyList">

                    <div class="text-center text-muted py-4">

                        Loading properties...

                    </div>

                </div>

            </div>


        </div>

    </section>


</div>



<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script type="module">


    /* =================================================
       FIREBASE IMPORTS
       ================================================= */

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        doc,
        updateDoc,
        deleteDoc,
        serverTimestamp,
        query,
        orderBy
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



    /* =================================================
       FIREBASE CONFIG
       ================================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDEXN8qvN0rEOnwO__X3uk5krnDltGQ6q",

        authDomain:
            "plotink-d7fcb.firebaseapp.com",

        projectId:
            "plotink-d7fcb",

        storageBucket:
            "plotink-d7fcb.firebasestorage.app",

        messagingSenderId:
            "383004515902",

        appId:
            "1:383004515902:web:9a2723761b0a48530bfb6f",

        measurementId:
            "G-ML6HP5NX8Q"

    };



    /* =================================================
       INITIALIZE FIREBASE
       ================================================= */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    /* =================================================
       ELEMENTS
       ================================================= */

    const loginSection =
        document.getElementById("loginSection");


    const adminSection =
        document.getElementById("adminSection");


    const loginForm =
        document.getElementById("loginForm");


    const logoutBtn =
        document.getElementById("logoutBtn");


    const loginMessage =
        document.getElementById("loginMessage");


    const propertyForm =
        document.getElementById("propertyForm");


    const propertyList =
        document.getElementById("propertyList");


    const propertyMessage =
        document.getElementById("propertyMessage");


    const formTitle =
        document.getElementById("formTitle");


    const saveButtonText =
        document.getElementById("saveButtonText");


    const cancelEditBtn =
        document.getElementById("cancelEditBtn");


    const refreshPropertiesBtn =
        document.getElementById("refreshPropertiesBtn");


    let editingId = null;



    /* =================================================
       LOGIN
       ================================================= */

    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("loginPassword")
                    .value;


            loginMessage.innerHTML =

                `<div class="alert alert-info">
                    <i class="bi bi-hourglass-split"></i>
                    Logging in...
                 </div>`;


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                loginMessage.innerHTML = "";


            }
            catch (error) {

                console.error(
                    "Firebase Login Error:",
                    error
                );


                loginMessage.innerHTML =

                    `<div class="alert alert-danger">

                        <strong>
                            Login Error:
                        </strong>

                        <br>

                        ${error.code}

                        <br>

                        ${error.message}

                    </div>`;

            }

        }
    );



    /* =================================================
       AUTH STATE
       ================================================= */

    onAuthStateChanged(
        auth,
        function(user) {

            if (user) {

                loginSection
                    .classList
                    .add("hidden");


                adminSection
                    .classList
                    .remove("hidden");


                logoutBtn
                    .classList
                    .remove("hidden");


                loadProperties();

            }
            else {

                loginSection
                    .classList
                    .remove("hidden");


                adminSection
                    .classList
                    .add("hidden");


                logoutBtn
                    .classList
                    .add("hidden");

            }

        }
    );



    /* =================================================
       LOGOUT
       ================================================= */

    logoutBtn.addEventListener(
        "click",
        async function() {

            try {

                await signOut(auth);

            }
            catch (error) {

                console.error(
                    "Logout Error:",
                    error
                );

            }

        }
    );



    /* =================================================
       SAVE PROPERTY
       ================================================= */

    propertyForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const propertyData = {

                title:
                    document
                        .getElementById("propertyTitle")
                        .value
                        .trim(),

                type:
                    document
                        .getElementById("propertyType")
                        .value,

                location:
                    document
                        .getElementById("propertyLocation")
                        .value
                        .trim(),

                price:
                    document
                        .getElementById("propertyPrice")
                        .value
                        .trim(),

                area:
                    document
                        .getElementById("propertyArea")
                        .value
                        .trim(),

                link:
                    document
                        .getElementById("propertyLink")
                        .value
                        .trim(),

                image:
                    document
                        .getElementById("propertyImage")
                        .value
                        .trim(),

                description:
                    document
                        .getElementById("propertyDescription")
                        .value
                        .trim(),

                status:
                    document
                        .getElementById("propertyStatus")
                        .value,

                featured:
                    document
                        .getElementById("propertyFeatured")
                        .value,

                updatedAt:
                    serverTimestamp()

            };


            try {

                propertyMessage.innerHTML =

                    `<div class="alert alert-info">
                        Saving property...
                     </div>`;


                /* EDIT */

                if (editingId) {

                    const propertyRef =
                        doc(
                            db,
                            "properties",
                            editingId
                        );


                    await updateDoc(
                        propertyRef,
                        propertyData
                    );


                    propertyMessage.innerHTML =

                        `<div class="alert alert-success">
                            Property updated successfully.
                         </div>`;

                }


                /* ADD */

                else {

                    propertyData.createdAt =
                        serverTimestamp();


                    await addDoc(
                        collection(
                            db,
                            "properties"
                        ),
                        propertyData
                    );


                    propertyMessage.innerHTML =

                        `<div class="alert alert-success">
                            Property added successfully.
                         </div>`;

                }


                resetForm();

                loadProperties();


            }
            catch (error) {

                console.error(
                    "Save Property Error:",
                    error
                );


                propertyMessage.innerHTML =

                    `<div class="alert alert-danger">

                        <strong>
                            Error:
                        </strong>

                        <br>

                        ${error.code || ""}

                        <br>

                        ${error.message}

                    </div>`;

            }

        }
    );



    /* =================================================
       LOAD PROPERTIES
       ================================================= */

    async function loadProperties() {

        propertyList.innerHTML =

            `<div class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm"></div>
                Loading properties...
             </div>`;


        try {

            const propertiesQuery =
                query(
                    collection(
                        db,
                        "properties"
                    ),
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                );


            const snapshot =
                await getDocs(
                    propertiesQuery
                );


            propertyList.innerHTML = "";


            if (snapshot.empty) {

                propertyList.innerHTML =

                    `<div class="alert alert-light border text-center">

                        <i class="bi bi-building fs-3"></i>

                        <br>

                        No properties added yet.

                    </div>`;

                return;

            }


            snapshot.forEach(
                function(propertyDoc) {

                    const property =
                        propertyDoc.data();


                    const id =
                        propertyDoc.id;


                    const card =
                        createPropertyCard(
                            id,
                            property
                        );


                    propertyList.appendChild(
                        card
                    );

                }
            );


        }
        catch (error) {

            console.error(
                "Load Properties Error:",
                error
            );


            propertyList.innerHTML =

                `<div class="alert alert-danger">

                    <strong>
                        Error loading properties:
                    </strong>

                    <br>

                    ${error.code || ""}

                    <br>

                    ${error.message}

                </div>`;

        }

    }



    /* =================================================
       CREATE PROPERTY CARD
       ================================================= */

    function createPropertyCard(
        id,
        property
    ) {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "property-card";


        const image =
            property.image ||
            "images/property1.jpg";


        const title =
            property.title ||
            "Untitled Property";


        const type =
            property.type ||
            "Property";


        const location =
            property.location ||
            "Location not specified";


        const price =
            property.price ||
            "Price on request";


        const area =
            property.area ||
            "Area not specified";


        const status =
            property.status ||
            "Available";


        const featured =
            property.featured === "yes";


        let statusClass =
            "bg-success";


        if (status === "Sold") {

            statusClass =
                "bg-danger";

        }
        else if (status === "Rented") {

            statusClass =
                "bg-warning text-dark";

        }


        wrapper.innerHTML = `

            <div class="row align-items-center">

                <div class="col-md-2">

                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(title)}"
                        class="property-image w-100"
                        onerror="this.src='images/property1.jpg';">

                </div>


                <div class="col-md-7">

                    <h5 class="mb-1">
                        ${escapeHtml(title)}
                    </h5>

                    <div class="mb-2">

                        <span class="badge bg-secondary">
                            ${escapeHtml(type)}
                        </span>

                        <span class="badge ${statusClass}">
                            ${escapeHtml(status)}
                        </span>

                        ${
                            featured
                            ?
                            `<span class="badge bg-warning text-dark">
                                ⭐ Featured
                             </span>`
                            :
                            ""
                        }

                    </div>


                    <p class="mb-1">

                        <i class="bi bi-geo-alt"></i>

                        ${escapeHtml(location)}

                    </p>


                    <p class="mb-1">

                        <strong>
                            ${escapeHtml(price)}
                        </strong>

                        &nbsp; | &nbsp;

                        ${escapeHtml(area)}

                    </p>


                    <p class="text-muted small mb-0">

                        ${escapeHtml(
                            property.description || ""
                        )}

                    </p>

                </div>


                <div class="col-md-3 mt-3 mt-md-0">

                    <div class="d-grid gap-2">

                        ${
                            property.link
                            ?
                            `<a
                                href="${escapeHtml(property.link)}"
                                target="_blank"
                                class="btn btn-outline-primary btn-sm">

                                <i class="bi bi-box-arrow-up-right"></i>
                                View

                             </a>`
                            :
                            ""
                        }


                        <button
                            type="button"
                            class="btn btn-outline-success btn-sm edit-property">

                            <i class="bi bi-pencil"></i>
                            Edit

                        </button>


                        <button
                            type="button"
                            class="btn btn-outline-danger btn-sm delete-property">

                            <i class="bi bi-trash"></i>
                            Delete

                        </button>

                    </div>

                </div>

            </div>

        `;


        /* EDIT BUTTON */

        wrapper
            .querySelector(".edit-property")
            .addEventListener(
                "click",
                function() {

                    editProperty(
                        id,
                        property
                    );

                }
            );


        /* DELETE BUTTON */

        wrapper
            .querySelector(".delete-property")
            .addEventListener(
                "click",
                function() {

                    deleteProperty(id);

                }
            );


        return wrapper;

    }



    /* =================================================
       EDIT PROPERTY
       ================================================= */

    function editProperty(
        id,
        property
    ) {

        editingId = id;


        document
            .getElementById("propertyTitle")
            .value =
                property.title || "";


        document
            .getElementById("propertyType")
            .value =
                property.type || "";


        document
            .getElementById("propertyLocation")
            .value =
                property.location || "";


        document
            .getElementById("propertyPrice")
            .value =
                property.price || "";


        document
            .getElementById("propertyArea")
            .value =
                property.area || "";


        document
            .getElementById("propertyLink")
            .value =
                property.link || "";


        document
            .getElementById("propertyImage")
            .value =
                property.image || "";


        document
            .getElementById("propertyDescription")
            .value =
                property.description || "";


        document
            .getElementById("propertyStatus")
            .value =
                property.status || "Available";


        document
            .getElementById("propertyFeatured")
            .value =
                property.featured || "no";


        formTitle.innerHTML =

            `<i class="bi bi-pencil-square"></i>
             Edit Property`;


        saveButtonText.textContent =
            "Update Property";


        cancelEditBtn
            .classList
            .remove("hidden");


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }



    /* =================================================
       DELETE PROPERTY
       ================================================= */

    async function deleteProperty(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this property?"
            );


        if (!confirmed) {
            return;
        }


        try {

            await deleteDoc(
                doc(
                    db,
                    "properties",
                    id
                )
            );


            propertyMessage.innerHTML =

                `<div class="alert alert-success">
                    Property deleted successfully.
                 </div>`;


            loadProperties();


        }
        catch (error) {

            console.error(
                "Delete Property Error:",
                error
            );


            propertyMessage.innerHTML =

                `<div class="alert alert-danger">

                    <strong>
                        Delete Error:
                    </strong>

                    <br>

                    ${error.code || ""}

                    <br>

                    ${error.message}

                </div>`;

        }

    }



    /* =================================================
       RESET FORM
       ================================================= */

    function resetForm() {

        editingId = null;


        propertyForm.reset();


        document
            .getElementById("propertyStatus")
            .value =
                "Available";


        document
            .getElementById("propertyFeatured")
            .value =
                "yes";


        formTitle.innerHTML =

            `<i class="bi bi-plus-circle"></i>
             Add Property`;


        saveButtonText.textContent =
            "Save Property";


        cancelEditBtn
            .classList
            .add("hidden");

    }



    /* =================================================
       CANCEL EDIT
       ================================================= */

    cancelEditBtn.addEventListener(
        "click",
        function() {

            resetForm();

            propertyMessage.innerHTML = "";

        }
    );



    /* =================================================
       REFRESH
       ================================================= */

    refreshPropertiesBtn.addEventListener(
        "click",
        function() {

            loadProperties();

        }
    );



    /* =================================================
       HTML ESCAPE
       ================================================= */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


</script>


</body>

</html>
